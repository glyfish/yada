[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
markers =
    integration: touches Postgres/Chroma (not run by default)
    llm: calls a real model (costs money, nondeterministic)
filterwarnings =
    # Third-party: chromadb's telemetry uses asyncio.iscoroutinefunction, deprecated
    # on Python 3.14. Not our code — ignore just this one message so our own
    # warnings stay visible.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
